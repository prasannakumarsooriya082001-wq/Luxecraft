spring.application.name=luxecraft

# Loads application-local.properties (gitignored) for machine-specific
# secrets, so no environment variables are needed to run locally.
# Override in production with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


# =========================================================
# DATABASE
# Values come from environment variables where available, so
# nothing secret has to be committed to source control.
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/luxecraft_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep the DB connection tied to the service call instead of holding it open
# until the response has been written. Safe here because no entity uses a lazy
# association, so nothing needs the session during serialisation.
spring.jpa.open-in-view=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# JWT
# jwt.secret MUST be set (min 32 characters) or startup fails.
# Generate one with:  openssl rand -base64 48
# =========================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}


# =========================================================
# MAIL
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# PAYMENTS
# =========================================================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}


# =========================================================
# FILE UPLOADS
#
# Uploaded product images are runtime data, not source code, so they
# live outside src/. Set an absolute path in application-local.properties
# so it does not depend on which folder the app is started from.
# =========================================================
app.upload.dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


