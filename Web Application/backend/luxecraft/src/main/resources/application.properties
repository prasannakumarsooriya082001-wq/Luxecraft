spring.application.name=luxecraft

# =========================================================
# NO SECRETS IN THIS FILE - it is committed to GitHub.
#
# Real credentials live in application-local.properties, which
# is listed in .gitignore and never leaves your machine. That
# file is loaded automatically because the 'local' profile is
# active by default.
#
# In production (Railway) there is no local file, so every
# secret must come from an environment variable. The empty
# defaults below are deliberate: if a variable is missing the
# app fails loudly at startup instead of running on a weak
# fallback that is public on GitHub.
# =========================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


# =========================================================
# SERVER
# Railway assigns the port at runtime through PORT.
# =========================================================
server.port=${PORT:8080}


# =========================================================
# DATABASE
# On Railway the Postgres service supplies PGHOST / PGPORT /
# PGUSER / PGPASSWORD / POSTGRES_DB. With none of them set the
# URL falls back to the local dev database, and the password
# comes from application-local.properties.
# =========================================================
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${POSTGRES_DB:luxecraft_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Railway's Postgres allows fewer connections than Hikari's default of 10,
# and the private network takes a moment to come up on a cold start.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Keep the DB connection tied to the service call instead of holding it open
# until the response has been written. Safe here because no entity uses a lazy
# association, so nothing needs the session during serialisation.
spring.jpa.open-in-view=false


# =========================================================
# CORS
# Browsers only let these origins call the API. Comma-separated,
# no trailing slash, scheme included. Override per environment with
# CORS_ALLOWED_ORIGINS rather than editing this list.
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,https://luxesofa2.netlify.app}


# =========================================================
# JWT
# Must be at least 32 characters or startup fails.
# Generate one with:  openssl rand -base64 48
# =========================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}


# =========================================================
# FIRST ADMIN ACCOUNT
# There is no admin sign-up endpoint, so a fresh database has no
# way in. On startup the app creates this account if it is missing.
#
# Seeding only runs when the password is set - keep it in an env var
# (ADMIN_SEED_PASSWORD), never here, since this file is public. Change
# the password from the admin settings page after the first login.
# =========================================================
app.admin.seed.email=${ADMIN_SEED_EMAIL:admin@luxecraft.com}
app.admin.seed.password=${ADMIN_SEED_PASSWORD:}
app.admin.seed.name=${ADMIN_SEED_NAME:Administrator}
app.admin.seed.phone=${ADMIN_SEED_PHONE:+910000000000}


# =========================================================
# MAIL
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# PAYMENTS
# =========================================================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}


# =========================================================
# FILE UPLOADS
#
# Railway containers have an ephemeral filesystem - anything written
# here is lost on every redeploy. To keep uploaded images, attach a
# Railway volume and point UPLOAD_DIR at its mount path.
# =========================================================
app.upload.dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

