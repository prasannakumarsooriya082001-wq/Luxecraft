<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders Management</title>

    <link rel="stylesheet" href="/pages/admin-orders/admin-orders.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="admin-container">

        <!-- Sidebar -->

        <aside class="sidebar" id="adminSidebar"></aside>
        <!-- Main Content -->

        <main class="main-content">

            <div class="top-header">

                <div>

                    <h1>Orders Management</h1>

                    <p>Manage all customer orders.</p>

                </div>

            </div>

            <!-- Toolbar -->

            <div class="toolbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" id="search" placeholder="Search Order">

                </div>

                <div class="category-wrapper">
                    <select class="category-filter" id="category">

                        <option>All Orders</option>

                        <option>Pending</option>

                        <option>In Progress</option>

                        <option>Delivered</option>

                        <option>Cancelled</option>

                    </select>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>

            </div>

            <!-- Orders Table -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Order ID</th>

                            <th>Customer</th>

                            <th>Product</th>

                            <th>Date</th>

                            <th>Amount</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="orderTableBody">

                        <tr>

                            <td colspan="7" style="text-align:center;">
                                Loading orders...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="/common/api-config.js"></script>
    <script src="/common/admin-nav.js"></script>
    <script src="/pages/admin-orders/admin-orders.js"></script>

</body>

</html>
