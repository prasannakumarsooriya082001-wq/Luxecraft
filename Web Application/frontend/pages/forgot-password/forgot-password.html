    <section class="forgot-section">


        <div class="forgot-container">

            <div class="forgot-image">

                <img src="/assets/images/sofa1.jpg" alt="Luxury Sofa">

                <div class="overlay">

                    <h2>Forgot Your Password?</h2>

                    <p>Don't worry. We'll help you recover your account securely.</p>

                </div>

            </div>

            <div class="forgot-form">

                <h2>Forgot Password</h2>

                <p>
                    Enter your registered email address
                    to receive a verification code.
                </p>

                <form id="forgotForm">

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email" id="email" placeholder="Enter your email" required>

                    </div>

                    <button class="sentBtn" type="submit">Send OTP</button>

                    <p class="back-login">
                        Remember your password?
                        <a href="/pages/login/login.html">Login</a>
                    </p>

                </form>

            </div>

        </div>

    </section>




    <script src="/common/api-config.js"></script>
