<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Category</title>

    <link rel="stylesheet" href="/pages/add-categories/add-categories.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>Add New Category</h1>

            <a href="/pages/admin-categories/admin-categories.html" class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Categories

            </a>

        </header>

        <form id="categoryForm" class="card">

            <!-- Category Name -->

            <div class="form-group">

                <label>Category Name</label>

                <input type="text" id="categoryName" placeholder="Enter Category Name" required>

            </div>

            

            <!-- Description -->

            <div class="form-group">

                <label>Description</label>

                <textarea id="description" rows="5" placeholder="Enter Category Description" required></textarea>

            </div>

            

            <!-- Status -->

            <div class="form-group">

                <label>Status</label>

                <select id="status">

                    <option value="Active">Active</option>

                    <option value="Inactive">Inactive</option>

                </select>

            </div>

            <!-- Buttons -->

            <div class="button-group">

                <button type="submit" class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Category

                </button>

                <button type="button" class="cancel-btn">

                    <i class="fa-solid fa-xmark"></i>

                    Cancel

                </button>

            </div>

        </form>

    </div>

    <script src="/common/api-config.js"></script>
    <script src="/pages/add-categories/add-categories.js"></script>

</body>

</html>
