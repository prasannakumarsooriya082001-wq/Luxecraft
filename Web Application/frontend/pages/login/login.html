    <!-- ===================== LOGIN SECTION ===================== -->

    <section class="login-section">

        <div class="login-container">

            <!-- Left Side -->

            <div class="login-image">

                <img src="/frontend/assets/images/MainSofaImage.jpg" alt="Luxury Sofa">

                <div class="overlay">

                    <h2>Crafted For Luxury Living</h2>

                    <p>Experience premium comfort with our handcrafted sofas.</p>

                </div>

            </div>

            <!-- Right Side -->

            <div class="login-form">

                <a href="/frontend/index.html" class="back-home">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Home
                </a>

                <h2 id="loginTitle">Welcome Back</h2>

                <p id="loginDescription">Login to continue shopping.</p>

                <!-- Login As -->

                <p class="login-as">Login As</p>

                <!-- User / Admin Tabs -->

                <div class="login-tabs">

                    <button type="button" class="tab-btn active" id="userTab">User</button>

                    <button type="button" class="tab-btn" id="adminTab">Admin</button>

                </div>

                <!-- Login Form -->

                <form id="loginForm">

                    <label> Email Address</label>

                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required>

                    <label>Password</label>

                    <div class="password-box">

                        <input type="password" id="password" class="form-input" placeholder="Enter your password"
                            required>

                        <i class="fa-solid fa-eye" id="togglePassword"></i>

                    </div>

                    <div class="login-options">

                        <label>

                            <input type="checkbox">Remember Me

                        </label>

                        <a href="/frontend/pages/forgot-password/forgot-password.html" id="forgotPasswordLink">Forgot Password?</a>

                    </div>

                    <button type="submit" class="login-btn" id="login-btn">Login</button>

                </form>

                <!-- Register -->

                <p class="register-link" id="registerLink">

                    Don't have an account?

                    <a href="/frontend/pages/register/register.html">Sign Up</a>

                </p>

            </div>

        </div>

    </section>

    <script src="/frontend/common/api-config.js"></script>
    <script src="/frontend/pages/login/login.js"></script>
