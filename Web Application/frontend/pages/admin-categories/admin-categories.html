<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories Management</title>

    <link rel="stylesheet" href="/frontend/pages/admin-categories/admin-categories.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="admin-container">

        <aside class="sidebar" id="adminSidebar"></aside>

        <main class="main-content">

            <div class="top-header">

                <div>

                    <h1>Categories Management</h1>

                    <p>Manage all sofa categories.</p>

                </div>

                <button class="add-category-btn" id="add-category">

                    <i class="fa-solid fa-plus"></i>Add Category

                </button>

            </div>

            <!-- Toolbar -->

            <div class="toolbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" id="search" placeholder="Search Category">

                </div>

            </div>

            <!-- Table -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Category ID</th>

                            <th>Category Name</th>

                            <th>Description</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="categoryTableBody">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="/frontend/common/api-config.js"></script>
    <script src="/frontend/common/admin-nav.js"></script>
    <script src="/frontend/pages/admin-categories/admin-categories.js"></script>

</body>

</html>
