    <section class="reset-section">

        <div class="reset-container">

            <div class="reset-image">

                <img src="/frontend/assets/images/sofa1.jpg" alt="Luxury Sofa">

                <div class="overlay">

                    <h2>Create New Password</h2>

                    <p>Choose a strong password to keep your account secure.</p>

                </div>

            </div>

            <div class="reset-form">

                <h2>Reset Password</h2>

                <p>Enter your new password below.</p>

                <form id="resetForm">

                    <label>New Password</label>
                    <div class="password-box">

                        <input type="password" class="form-input" id="newPassword" placeholder="Enter new password">
                        <i class="fa-solid fa-eye" id="toggleNewPassword"></i>

                    </div>

                    <label>Confirm Password</label>
                    <div class="password-box">

                        <input type="password" class="form-input" id="confirmPassword" placeholder="Confirm new password">
                        <i class="fa-solid fa-eye" id="toggleConfirmPassword"></i>

                    </div>

                    <p id="matchMessage" class="match-message"></p>

                    <button type="submit" class="update-btn">Update Password</button>

                    <p class="back-login">
                        Remember your password?
                        <a href="/frontend/pages/login/login.html">Login</a>
                    </p>

                </form>

            </div>

        </div>

    </section>

    
    <script src="/frontend/common/api-config.js"></script>
    <script src="/frontend/pages/reset-password/reset-password.js"></script>
