<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Customer</title>

    <link rel="stylesheet" href="/frontend/pages/add-customers/add-customers.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="admin-container">

        <!-- Sidebar -->

        <aside class="sidebar" id="adminSidebar"></aside>

        <!-- Main Content -->

        <main class="main-content">

            <div class="top-header">

                <div>

                    <h1>Add Customer</h1>

                    <p>Create a new customer account.</p>

                </div>

                <a href="/frontend/pages/admin-customers/admin-customers.html" class="back-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </a>

            </div>

            <!-- Form -->

            <div class="form-card">

                <form id="customerForm">

                    <div class="form-grid">

                        <div class="input-group">

                            <label>First Name</label>

                            <input type="text" id="firstName" placeholder="Enter First Name" required>

                        </div>


                        <div class="input-group">

                            <label>Last Name</label>

                            <input type="text" id="lastName" placeholder="Enter Last Name" required>

                        </div>

                        <div class="input-group">

                            <label>Email</label>

                            <input type="email" id="email" placeholder="Enter Email" required>

                        </div>

                        <div class="input-group">

                            <label>Phone</label>

                            <input type="tel" id="phone" placeholder="Enter Phone Number" required>

                        </div>

                        <div class="input-group">

                            <label>Status</label>

                            <select id="status">

                                <option>Active</option>

                                <option>Inactive</option>

                            </select>

                        </div>

                        <div class="input-group full-width">

                            <label>Address</label>

                            <textarea id="address" rows="4" placeholder="Enter Address"></textarea>

                        </div>

                    </div>

                    <div class="button-group">

                        <button type="submit" class="save-btn">Save Customer</button>

                        <button type="button" class="cancel-btn">Cancel</button>

                    </div>

                </form>

            </div>

        </main>

    </div>

    <script src="/frontend/common/api-config.js"></script>
    <script src="/frontend/common/admin-nav.js"></script>
    <script src="/frontend/pages/add-customers/add-customers.js"></script>

</body>

</html>
