<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - LuxeCraft</title>

    <link rel="stylesheet" href="/pages/profile/profile.css">

</head>

<body>

    <div class="profile-container">

        <div class="profile-card">

            <div class="profile-icon">
                👤
            </div>

            <h1>My Profile</h1>

            <p class="profile-subtitle">
                Manage your LuxeCraft account
            </p>


            <div class="profile-details">

                <div class="detail">

                    <label>First Name</label>

                    <p id="firstName">Loading...</p>

                </div>


                <div class="detail">

                    <label>Last Name</label>

                    <p id="lastName">Loading...</p>

                </div>


                <div class="detail">

                    <label>Email</label>

                    <p id="email">Loading...</p>

                </div>


                <div class="detail">

                    <label>Phone</label>

                    <p id="phone">Loading...</p>

                </div>


                <div class="detail">

                    <label>Role</label>

                    <p id="role">Loading...</p>

                </div>

            </div>


            <div class="profile-buttons">

                <button id="backButton">
                    Back to Home
                </button>

                <button id="logoutButton">
                    Logout
                </button>

            </div>

        </div>

    </div>


    <script src="/common/api-config.js"></script>
    <script src="/pages/profile/profile.js"></script>

</body>

</html>
